name: Bug
description: Something broke or behaves oddly
labels: [bug]
body:
  - type: input
    id: link
    attributes:
      label: Link to the sounding (if relevant)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Safari, iPhone 15
