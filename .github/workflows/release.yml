name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - run: npm run check
      - run: gh release create "$GITHUB_REF_NAME" dist-single/underfoot.html --generate-notes --title "Underfoot $GITHUB_REF_NAME"
        env: { GH_TOKEN: '${{ github.token }}' }
